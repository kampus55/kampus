<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KAMPÜS</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#03051d;
    color:white;
}

/* =========================
   GENEL
========================= */

.screen{
    min-height:100vh;
    background:
    radial-gradient(
        circle at 85% 8%,
        rgba(162,28,255,.35),
        transparent 30%
    ),
    radial-gradient(
        circle at 10% 40%,
        rgba(8,116,255,.25),
        transparent 38%
    ),
    linear-gradient(
        180deg,
        #050426 0%,
        #06174c 58%,
        #02051d 100%
    );
}

.hidden{
    display:none !important;
}

button{
    font-family:inherit;
    cursor:pointer;
}

/* =========================
   GİRİŞ
========================= */

.login-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow:hidden;
}

.login-art{
    width:min(100vw,711px);
    height:100vh;
    min-height:720px;
    position:relative;
}

.login-art img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.login-hit{
    position:absolute;
    left:7%;
    width:86%;
    height:8.2%;
    background:transparent;
    border:0;
}

.login-hit.one{
    top:73.3%;
}

.login-hit.two{
    top:82.7%;
}


/* =========================
   UYGULAMA
========================= */

.app{
    min-height:100vh;
    padding:20px 20px 105px;
}

.topbar{
    max-width:1060px;
    margin:auto;

    display:grid;

    grid-template-columns:
    62px
    1fr
    62px;

    align-items:center;
    gap:14px;
}

.icon-btn{
    height:62px;
    border-radius:19px;

    border:1px solid #6937a8;

    background:#0b0d2d;

    color:white;

    font-size:35px;

    box-shadow:
    0 0 18px
    rgba(99,23,170,.2);
}

.brand{
    text-align:center;

    font-size:44px;

    font-weight:900;

    letter-spacing:-2px;
}

.brand .a{
    color:#1687ff;
}

.brand .p{
    color:#b92cff;
}


/* =========================
   KOÇLUK BAŞLIK
========================= */

.coach-title{

    text-align:center;

    margin:
    15px
    0
    22px;

    font-size:42px;

    font-weight:900;

    color:#b72dff;

    text-shadow:
    0 0 18px
    #8221ff;
}


/* =========================
   ADIMLAR
========================= */

.steps{

    max-width:1050px;

    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(4,1fr);
}

.step{

    position:relative;

    text-align:center;

    color:#aeb0c7;

    font-size:17px;
}

.step:not(:last-child)::after{

    content:"";

    position:absolute;

    top:27px;

    left:60%;

    right:-40%;

    height:3px;

    background:#28294e;
}

.step.active{

    color:#c62fff;
}

.step.active:not(:last-child)::after{

    background:
    linear-gradient(
        90deg,
        #9a27ff,
        #302e55
    );
}

.circle{

    position:relative;

    z-index:2;

    margin:
    0
    auto
    12px;

    width:54px;

    height:54px;

    border-radius:50%;

    display:grid;

    place-items:center;

    border:
    3px solid
    #303158;

    background:#080a28;

    font-size:23px;

    font-weight:bold;
}

.step.active .circle{

    border-color:#9134ff;

    box-shadow:
    0 0 20px
    #8125ff;

    background:#11103d;
}


/* =========================
   İÇERİK
========================= */

.content{

    max-width:1050px;

    margin:
    42px
    auto
    0;
}

.hero-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:30px;
}

.hero h1{

    font-size:46px;

    margin-bottom:10px;

    line-height:1.12;
}

.gradient{

    background:
    linear-gradient(
        90deg,
        #008dff,
        #c22cff
    );

    color:transparent;

    background-clip:text;

    -webkit-background-clip:text;
}

.hero p{

    font-size:21px;

    color:#c7cadb;

    line-height:1.55;
}

.target{

    width:190px;

    height:190px;

    flex:0 0 190px;

    border-radius:50%;

    display:grid;

    place-items:center;

    font-size:105px;

    background:
    radial-gradient(
        circle,
        #291067,
        #100a3b
    );

    box-shadow:
    0 0 35px
    #8d21ff66;

    border:
    2px solid
    #8e28ff;
}


/* =========================
   SINAV KARTLARI
========================= */

.cards{

    display:grid;

    grid-template-columns:
    repeat(6,1fr);

    gap:16px;

    margin-top:25px;
}

.card{

    grid-column:span 2;

    min-height:280px;

    padding:20px;

    border-radius:22px;

    background:
    linear-gradient(
        145deg,
        #07173c,
        #09091f
    );

    border:
    1px solid
    #097aff;

    position:relative;

    overflow:hidden;

    color:white;

    text-align:left;
}

.card:nth-child(2){

    border-color:#9d24ff;

    background:
    linear-gradient(
        145deg,
        #16093c,
        #08091f
    );
}

.card:nth-child(3){

    border-color:#008edc;
}

.card:nth-child(4){

    grid-column:span 3;

    border-color:#08a849;

    background:
    linear-gradient(
        145deg,
        #042d20,
        #07151b
    );
}

.card:nth-child(5){

    grid-column:span 3;

    border-color:#bd6412;

    background:
    linear-gradient(
        145deg,
        #30150b,
        #0d0b13
    );
}

.card.selected{

    box-shadow:
    0 0 0 2px white,
    0 0 28px
    #8529ff88;
}

.card .icon{

    width:62px;

    height:62px;

    border-radius:14px;

    display:grid;

    place-items:center;

    font-size:31px;

    background:#0b6cff;
}

.card:nth-child(2) .icon{
    background:#8f1fe8;
}

.card:nth-child(3) .icon{
    background:#087fd0;
}

.card:nth-child(4) .icon{
    background:#08a846;
}

.card:nth-child(5) .icon{
    background:#e66d08;
}

.card h2{

    font-size:31px;

    margin:
    17px
    0
    8px;
}

.card p{

    font-size:17px;

    line-height:1.5;

    color:#d0d2df;
}

.card .arrow{

    position:absolute;

    right:18px;

    bottom:18px;

    width:52px;

    height:52px;

    border-radius:50%;

    display:grid;

    place-items:center;

    font-size:31px;

    background:#1168ed;
}

.card:nth-child(2) .arrow{
    background:#8c20e6;
}

.card:nth-child(3) .arrow{
    background:#087ed0;
}

.card:nth-child(4) .arrow{
    background:#08a846;
}

.card:nth-child(5) .arrow{
    background:#e56d0a;
}


/* =========================
   BİLGİ
========================= */

.info{

    margin-top:18px;

    padding:21px 24px;

    border-radius:20px;

    border:
    1px solid
    #6e30c4;

    background:#10082f99;

    display:flex;

    gap:20px;

    align-items:center;
}

.info-icon{

    font-size:45px;
}

.info b{

    font-size:21px;
}

.info span{

    display:block;

    color:#bfc2d6;

    margin-top:6px;
}


/* =========================
   ALT MENÜ
========================= */

.bottom{

    position:fixed;

    z-index:20;

    left:50%;

    bottom:10px;

    transform:
    translateX(-50%);

    width:
    min(
        1050px,
        calc(100% - 30px)
    );

    height:78px;

    border-radius:25px;

    background:#080b2eee;

    border:
    1px solid
    #2b315c;

    display:grid;

    grid-template-columns:
    repeat(5,1fr);

    align-items:center;

    text-align:center;

    color:#aeb2d0;

    backdrop-filter:blur(15px);
}

.bottom .active{

    color:white;
}

.plus{

    width:66px;

    height:66px;

    border-radius:50%;

    margin:auto;

    display:grid;

    place-items:center;

    font-size:43px;

    background:
    linear-gradient(
        135deg,
        #157dff,
        #8d17ff
    );

    box-shadow:
    0 0 28px
    #6821ff;
}


/* =========================
   FORM
========================= */

.form-panel{

    max-width:850px;

    margin:
    35px
    auto
    0;

    padding:30px;

    border:
    1px solid
    #3e2b7b;

    border-radius:26px;

    background:#080a26d9;

    box-shadow:
    0 20px 60px
    #0005;
}

.form-panel h1{

    font-size:36px;

    margin:
    0
    0
    8px;
}

.form-panel > p{

    color:#bfc2d5;

    font-size:18px;
}

.options{

    display:grid;

    gap:13px;

    margin-top:24px;
}

.option{

    padding:19px 20px;

    border-radius:17px;

    border:
    1px solid
    #30335f;

    background:#0c0f31;

    color:white;

    text-align:left;
}

.option:hover,
.option.selected{

    border-color:#a52cff;

    box-shadow:
    0 0 18px
    #8421ff33;
}

.field{

    margin:18px 0;
}

.field label{

    display:block;

    margin-bottom:8px;

    color:#d5d6e2;
}

.field input,
.field select{

    width:100%;

    padding:15px;

    border-radius:14px;

    border:
    1px solid
    #34375f;

    background:#070923;

    color:white;

    outline:none;
}

.actions{

    display:flex;

    justify-content:space-between;

    gap:12px;

    margin-top:25px;
}

.action{

    padding:
    15px
    23px;

    border-radius:15px;

    border:
    1px solid
    #3b3e6a;

    background:#101338;

    color:white;
}

.action.primary{

    background:
    linear-gradient(
        100deg,
        #116cf1,
        #9222f4
    );

    border:0;
}

.badge{

    display:inline-block;

    padding:
    7px
    12px;

    border-radius:20px;

    background:#37106d;

    color:#d6a7ff;

    margin-bottom:10px;
}


/* =========================
   PLAN
========================= */

.plan-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:15px;

    margin-top:25px;
}

.plan-box{

    padding:20px;

    border-radius:18px;

    background:#0b0e30;

    border:
    1px solid
    #34376a;
}

.plan-box h3{

    margin:
    0
    0
    8px;
}

.plan-box p{

    color:#bfc2d4;

    line-height:1.5;
}


/* =========================
   MOBİL
========================= */

@media(max-width:700px){

    .app{
        padding:
        12px
        12px
        100px;
    }

    .topbar{

        grid-template-columns:
        50px
        1fr
        50px;
    }

    .icon-btn{

        height:50px;

        font-size:29px;
    }

    .brand{

        font-size:28px;
    }

    .coach-title{

        font-size:32px;

        margin:
        12px
        0
        18px;
    }

    .steps{

        font-size:13px;
    }

    .step:not(:last-child)::after{

        top:25px;
    }

    .circle{

        width:50px;

        height:50px;
    }

    .content{

        margin-top:28px;
    }

    .hero-row{

        align-items:flex-start;
    }

    .hero h1{

        font-size:31px;
    }

    .hero p{

        font-size:17px;
    }

    .target{

        width:105px;

        height:105px;

        flex-basis:105px;

        font-size:55px;
    }

    .cards{

        grid-template-columns:
        1fr 1fr;

        gap:10px;
    }

    .card,
    .card:nth-child(n){

        grid-column:span 1;

        min-height:235px;

        padding:15px;
    }

    .card:nth-child(4),
    .card:nth-child(5){

        grid-column:span 2;
    }

    .card h2{

        font-size:26px;
    }

    .card p{

        font-size:15px;
    }

    .card .arrow{

        width:43px;

        height:43px;

        font-size:25px;
    }

    .info{

        padding:16px;
    }

    .info-icon{

        font-size:35px;
    }

    .info b{

        font-size:17px;
    }

    .info span{

        font-size:14px;
    }

    .bottom{

        height:70px;
    }

    .plus{

        width:58px;

        height:58px;
    }

    .form-panel{

        padding:20px;

        margin-top:25px;
    }

    .form-panel h1{

        font-size:28px;
    }

    .plan-grid{

        grid-template-columns:1fr;
    }
}

</style>
</head>


<body>


<!-- =================================
     GİRİŞ EKRANI
================================= -->

<section
    id="login"
    class="login-screen screen"
>

    <div class="login-art">

        <!-- Onayladığımız giriş görseli -->
        <img
            src="giris.jpg"
            alt="KAMPÜS giriş ekranı"
        >

        <!-- Giriş Yap -->
        <button
            class="login-hit one"
            onclick="openCoach()"
            aria-label="Giriş Yap">
        </button>

        <!-- Kayıt Ol -->
        <button
            class="login-hit two"
            onclick="openCoach()"
            aria-label="Kayıt Ol">
        </button>

    </div>

</section>



<!-- =================================
     KOÇLUK UYGULAMASI
================================= -->

<section
    id="coach"
    class="app screen hidden"
>


<header class="topbar">

    <button
        class="icon-btn"
        onclick="backLogin()">
        ←
    </button>


    <div class="brand">

        K
        <span class="a">A</span>
        M
        <span class="p">P</span>
        ÜS

    </div>


    <button class="icon-btn">

        ♧

    </button>

</header>



<!-- KOÇLUK -->

<div class="coach-title">

    ♕　KOÇLUK　♕

</div>



<!-- ADIMLAR -->

<div class="steps">

    <div
        class="step active"
        id="s1">

        <div class="circle">
            1
        </div>

        Sınavını Seç

    </div>


    <div
        class="step"
        id="s2">

        <div class="circle">
            2
        </div>

        Hedefini Belirle

    </div>


    <div
        class="step"
        id="s3">

        <div class="circle">
            3
        </div>

        Bilgilerini Gir

    </div>


    <div
        class="step"
        id="s4">

        <div class="circle">
            4
        </div>

        Planını Hazır

    </div>

</div>



<!-- DİNAMİK İÇERİK -->

<main
    id="stepContent"
    class="content">
</main>



<!-- ALT MENÜ -->

<nav class="bottom">

    <div class="active">

        ⌂
        <br>
        Ana Sayfa

    </div>


    <div>

        ▧
        <br>
        Dersler

    </div>


    <div>

        <div class="plus">

            +

        </div>

    </div>


    <div>

        ▣
        <br>
        Planım

    </div>


    <div>

        ◯
        <br>
        Profil

    </div>

</nav>


</section>



<script>


/* =================================
   UYGULAMA VERİLERİ
================================= */

const state = {

    exam:null,

    target:null,

    days:null,

    level:null,

    name:null

};



/* =================================
   SINAVLAR
================================= */

const exams = [

    {
        id:"YKS",
        icon:"🎓",
        text:
        "TYT, AYT ve YDT ile üniversite hayaline bir adım daha yaklaş!"
    },

    {
        id:"KPSS",
        icon:"♙",
        text:
        "Kamu kariyerin için doğru hazırlık burada!"
    },

    {
        id:"ALES",
        icon:"📖",
        text:
        "Akademik kariyerin için başarıya giden yolu aç!"
    },

    {
        id:"DGS",
        icon:"↗",
        text:
        "Önlisans diplomanı lisansa taşımanın en akıllı yolunu planla."
    },

    {
        id:"LGS",
        icon:"✎",
        text:
        "Nitelikli liselere giden yolda sağlam bir başlangıç yap!"
    }

];



/* =================================
   GİRİŞ → KOÇLUK
================================= */

function openCoach(){

    document
        .getElementById("login")
        .classList
        .add("hidden");

    document
        .getElementById("coach")
        .classList
        .remove("hidden");

    renderStep(1);

    window.scrollTo(0,0);

}



/* =================================
   KOÇLUK → GİRİŞ
================================= */

function backLogin(){

    document
        .getElementById("coach")
        .classList
        .add("hidden");

    document
        .getElementById("login")
        .classList
        .remove("hidden");

    window.scrollTo(0,0);

}



/* =================================
   ADIM GÖSTER
================================= */

function setStep(n){

    for(
        let i=1;
        i<=4;
        i++
    ){

        document
            .getElementById("s"+i)
            .classList
            .toggle(
                "active",
                i===n
            );

    }

}



/* =================================
   ADIM YÖNETİMİ
================================= */

function renderStep(n){

    setStep(n);

    if(n===1){

        step1();

        return;
    }

    if(n===2){

        step2();

        return;
    }

    if(n===3){

        step3();

        return;
    }

    step4();

}



/* =================================
   1 — SINAV SEÇ
================================= */

function step1(){

    document
        .getElementById("stepContent")
        .innerHTML = `

        <div class="hero-row">

            <div class="hero">

                <h1>

                    Hangi

                    <span class="gradient">

                        sınava hazırlanıyorsun?

                    </span>

                </h1>


                <p>

                    Sana özel koçluk planını oluşturmak için
                    <br>
                    önce sınavını seçmelisin.

                </p>

            </div>


            <div class="target">

                🎯

            </div>

        </div>



        <div class="cards">

            ${

                exams.map(
                    e => `

                    <button
                        class="card
                        ${state.exam===e.id
                            ? "selected"
                            : ""}"

                        onclick="
                            selectExam('${e.id}')
                        "
                    >

                        <div class="icon">

                            ${e.icon}

                        </div>


                        <h2>

                            ${e.id}

                        </h2>


                        <p>

                            ${e.text}

                        </p>


                        <div class="arrow">

                            ›

                        </div>

                    </button>

                    `
                ).join("")

            }

        </div>



        <div class="info">

            <div class="info-icon">

                🛡

            </div>


            <div>

                <b>

                    Sınavını seç,
                    sana özel planın oluşsun!

                </b>


                <span>

                    Doğru plan, düzenli çalışma ve
                    motivasyon ile hedefin sandığından
                    daha yakın.

                </span>

            </div>

        </div>

    `;

}



/* =================================
   SINAV SEÇ
================================= */

function selectExam(id){

    state.exam = id;

    renderStep(2);

}



/* =================================
   2 — HEDEF
================================= */

function step2(){

    document
        .getElementById("stepContent")
        .innerHTML = `

        <div class="form-panel">

            <span class="badge">

                ${state.exam} seçildi

            </span>


            <h1>

                Hedefini belirle

            </h1>


            <p>

                Koçluk planını hedefin doğrultusunda
                kişiselleştirelim.

            </p>



            <div class="options">


                <button
                    class="option
                    ${
                        state.target ===
                        "Yüksek bir başarı hedefliyorum"
                        ? "selected"
                        : ""
                    }"

                    onclick="
                        pickTarget(
                            this,
                            'Yüksek bir başarı hedefliyorum'
                        )
                    "
                >

                    Yüksek bir başarı hedefliyorum

                </button>



                <button
                    class="option
                    ${
                        state.target ===
                        "Gerçekçi ve dengeli bir hedef istiyorum"
                        ? "selected"
                        : ""
                    }"

                    onclick="
                        pickTarget(
                            this,
                            'Gerçekçi ve dengeli bir hedef istiyorum'
                        )
                    "
                >

                    Gerçekçi ve dengeli bir hedef istiyorum

                </button>



                <button
                    class="option
                    ${
                        state.target ===
                        "Önceliğim düzenli çalışmaya başlamak"
                        ? "selected"
                        : ""
                    }"

                    onclick="
                        pickTarget(
                            this,
                            'Önceliğim düzenli çalışmaya başlamak'
                        )
                    "
                >

                    Önceliğim düzenli çalışmaya başlamak

                </button>


            </div>



            <div class="actions">

                <button
                    class="action"
                    onclick="renderStep(1)"
                >

                    ← Geri

                </button>


                <button
                    class="action primary"
                    onclick="renderStep(3)"
                >

                    Devam Et →

                </button>

            </div>

        </div>

    `;

}



/* =================================
   HEDEF SEÇ
================================= */

function pickTarget(el,x){

    state.target = x;

    document
        .querySelectorAll(".option")
        .forEach(
            item =>
            item.classList.remove("selected")
        );

    el.classList.add("selected");

}

/* =================================
   BİLGİLERİ KAYDET
================================= */

function saveInfo(){

    state.name =
        document
        .getElementById("name")
        .value
        .trim()
        ||
        "Öğrenci";


    state.days =
        document
        .getElementById("days")
        .value
        ||
        "2-4 saat";


    state.level =
        document
        .getElementById("level")
        .value
        ||
        "Orta";


    renderStep(4);

}
